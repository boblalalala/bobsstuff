<title>ALT Hiking App</title>
<meta name="description" content="Clickable prototype of the ALT hiking club app with example data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a phone-width app column beside a demo-guide rail; topo contour rings in headers; trail-blaze orange marks status. */
:root{
  --bg:#E7ECE8; --surface:#FAFCFA; --surface-2:#EFF3F0; --ink:#14221C; --muted:#56665E; --line:#D2DBD4;
  --forest:#1E4B3B; --forest-ink:#FFFFFF; --blaze:#C9501C; --blaze-soft:#FBE4D8; --contour:rgba(30,75,59,.10);
  --sea:#D5E2E7; --land:#F4F2EA; --land-line:#B5C1B9; --grid:rgba(30,75,59,.10);
  --ok:#21784A; --ok-soft:#DCEFE3; --warn:#9A6208; --warn-soft:#F7EACD; --bad:#AE3828; --bad-soft:#F6DDD8;
  --g1:#3B8A57; --g2:#2B739A; --g3:#A97806; --g4:#C4532A; --g5:#7A3569; --g-ink:#FFFFFF;
  --note-bg:#FFF6D8; --note-line:#D4AE42; --note-ink:#56430A;
  --shadow:0 1px 2px rgba(20,34,28,.06),0 10px 30px rgba(20,34,28,.10);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#141D19; --surface-2:#1A2520; --ink:#E3EBE5; --muted:#94A49B; --line:#29372F;
  --forest:#8CCBA9; --forest-ink:#0C1310; --blaze:#F0814F; --blaze-soft:#3A2318; --contour:rgba(140,203,169,.08);
  --sea:#0E1A20; --land:#1C2823; --land-line:#34463D; --grid:rgba(140,203,169,.10);
  --ok:#6FCB94; --ok-soft:#163025; --warn:#E3B04F; --warn-soft:#33280F; --bad:#EE8576; --bad-soft:#3A1A16;
  --g1:#6CC08A; --g2:#68B4DB; --g3:#E2B341; --g4:#F0855A; --g5:#CF8CBE; --g-ink:#0C1310;
  --note-bg:#2A2410; --note-line:#8C7428; --note-ink:#EED98E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#141D19; --surface-2:#1A2520; --ink:#E3EBE5; --muted:#94A49B; --line:#29372F;
  --forest:#8CCBA9; --forest-ink:#0C1310; --blaze:#F0814F; --blaze-soft:#3A2318; --contour:rgba(140,203,169,.08);
  --sea:#0E1A20; --land:#1C2823; --land-line:#34463D; --grid:rgba(140,203,169,.10);
  --ok:#6FCB94; --ok-soft:#163025; --warn:#E3B04F; --warn-soft:#33280F; --bad:#EE8576; --bad-soft:#3A1A16;
  --g1:#6CC08A; --g2:#68B4DB; --g3:#E2B341; --g4:#F0855A; --g5:#CF8CBE; --g-ink:#0C1310;
  --note-bg:#2A2410; --note-line:#8C7428; --note-ink:#EED98E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blaze);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;margin:0;text-wrap:balance;line-height:1.1}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ---------- page frame ---------- */
.stage{display:grid;grid-template-columns:minmax(0,320px) 393px;gap:40px;justify-content:center;align-items:start;padding-inline:24px;padding-block:24px}
.guide{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:34px;letter-spacing:-.01em;color:var(--forest)}
.brand span{font-size:13px;color:var(--muted)}
.guide p{margin:0;color:var(--muted);font-size:14px}
.ctl{display:flex;flex-direction:column;gap:8px}
.persona-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.persona{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:1.2;text-align:center}
.persona .av{width:30px;height:30px;font-size:12px}
.persona small{color:var(--muted);font-size:11px}
.persona[aria-pressed="true"]{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
.ctl-row{display:flex;gap:8px;flex-wrap:wrap}
.tour{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:t}
.tour li{counter-increment:t}
.tour button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 10px 42px;position:relative;display:flex;flex-direction:column;gap:2px}
.tour button::before{content:counter(t);position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font:700 11px/20px var(--f-mono);text-align:center;color:var(--forest)}
.tour button:hover{border-color:var(--forest)}
.tour b{font-size:14px}
.tour span{font-size:12.5px;color:var(--muted)}
.guide details summary{cursor:pointer;font-weight:700;list-style:none}
.guide details summary::-webkit-details-marker{display:none}

/* iPhone 15/16 Pro screen: 393 × 852 points */
.phone{background:var(--surface);border-radius:55px;box-shadow:var(--shadow),0 0 0 10px #1b1f1d,0 0 0 11px #3a403d;overflow:hidden;display:flex;flex-direction:column;width:393px;height:852px;position:relative;margin:11px}
.statusbar{height:54px;flex:none;display:grid;grid-template-columns:1fr 126px 1fr;align-items:center;padding:0 26px 0 34px;background:var(--surface);font:600 16px/1 -apple-system,'SF Pro Text',var(--f-body);color:var(--ink)}
.statusbar .island{height:37px;border-radius:20px;background:#000;margin-top:2px}
.statusbar .icons{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.statusbar svg{height:12px;fill:currentColor}
.tabs::after{content:"";grid-column:1/-1;justify-self:center;width:134px;height:5px;border-radius:3px;background:var(--ink);margin:2px 0 8px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.appbar .logo{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:20px;color:var(--forest);letter-spacing:-.01em}
.appbar h1{font-size:17px;font-stretch:100%;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--forest)}
.tabs button[aria-current="page"] svg{stroke-width:2.3}

/* ---------- shared bits ---------- */
.pad{padding:16px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:16px}
.link{border:0;background:none;color:var(--forest);font-weight:600;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tap{text-align:left;width:100%;display:block}
.tap:hover{border-color:var(--forest)}
.topo{background-color:var(--surface-2);background-image:repeating-radial-gradient(circle at 88% 115%,transparent 0 13px,var(--contour) 13px 14.5px)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--forest);color:var(--forest-ink);flex:none}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--forest);color:var(--forest-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--forest)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.blaze{background:var(--blaze);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%;padding:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 7px;border-radius:6px;background:var(--gc);color:var(--g-ink);font:700 12px/1 var(--f-mono);flex:none}
.grade.lg{height:30px;min-width:42px;font-size:15px;border-radius:8px}
.g1{--gc:var(--g1)}.g2{--gc:var(--g2)}.g3{--gc:var(--g3)}.g4{--gc:var(--g4)}.g5{--gc:var(--g5)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ready{background:var(--ok-soft);color:var(--ok)}
.pill.ontrack{background:var(--warn-soft);color:var(--warn)}
.pill.notyet{background:var(--bad-soft);color:var(--bad)}
.pill.override{background:var(--surface-2);color:var(--forest)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.verified{background:var(--ok-soft);color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag.physical{background:var(--blaze-soft);color:var(--blaze)}
.tag.skills{background:var(--surface-2);color:var(--forest)}
.note{background:var(--note-bg);border:1px dashed var(--note-line);color:var(--note-ink);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.note b{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--forest);border-radius:inherit}
.bar.blaze i{background:var(--blaze)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 17px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row > .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px);opacity:.4}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}

/* ---------- hero ---------- */
.hero{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:24px}
.hero .sub{font-size:14px;color:var(--muted)}

/* ---------- sessions ---------- */
.sess{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.date{border-radius:12px;background:var(--surface-2);text-align:center;padding:6px 0;display:flex;flex-direction:column;line-height:1.1}
.date b{font:700 20px/1.1 var(--f-mono)}
.date span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sess h3{font-size:15px;font-stretch:100%;font-family:var(--f-body);font-weight:700;margin-top:4px}
.meta{font-size:13px;color:var(--muted)}
.counts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.counts span{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.counts span.mine{border-color:var(--blaze);color:var(--blaze)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.done{font-size:13px;font-weight:700;color:var(--ok)}
.week{font-family:var(--f-display);font-stretch:112%;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:4px}

/* ---------- trips / trails ---------- */
.spark{display:block;width:100%;height:46px;color:var(--gc)}
.tripcard{padding:0;overflow:hidden}
.tripcard .art{height:70px;background:var(--surface-2);position:relative}
.tripcard .art svg{position:absolute;inset:auto 0 0 0;width:100%;height:100%}
.tripcard .art.has-photo{height:150px}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photohero{position:relative;height:210px;background:var(--surface-2);overflow:hidden}
.photohero .credit{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.photohero .change{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border:0}
.titleblock{padding:14px 16px 0;display:flex;flex-direction:column;gap:6px}
.titleblock h2{font-size:24px}
.addphoto{position:absolute;right:12px;bottom:12px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tripcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tripcard h3{font-size:17px}
.banner{position:relative;height:150px;background:var(--surface-2);overflow:hidden}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner .over{position:absolute;left:16px;right:16px;top:14px;display:flex;flex-direction:column;gap:6px}
.banner h2{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.facts div{background:var(--surface-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-width:0}
.facts b{font:700 14px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.facts span{font-size:11px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;border:1.5px solid var(--line);color:var(--muted)}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.path{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.path.met{border-color:var(--ok);background:var(--ok-soft)}
.path h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.or{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.leader{display:flex;gap:10px;align-items:flex-start}
.certs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cert{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.cert.warn{background:var(--warn-soft);color:var(--warn)}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.roster .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.roster .r:first-child{border-top:0}
.roster .why{font-size:12px;color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .s{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.trailrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center}
.trailrow .mini{height:40px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.trailrow h3{font-family:var(--f-body);font-stretch:100%;font-size:15px;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:500 10px var(--f-mono)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.factor{display:grid;grid-template-columns:minmax(0,1fr) 70px 40px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.factor .bar{height:6px}
.factor b{font-family:var(--f-mono);text-align:right;font-size:12.5px}
.scorebar{position:relative;height:28px;display:grid;grid-template-columns:2fr 1.5fr 2fr 4.5fr 3fr;gap:2px;margin-top:6px}
.scorebar div{border-radius:4px;background:var(--gc);opacity:.35;display:grid;place-items:center;font:700 10px var(--f-mono);color:var(--ink)}
.scorebar div.cur{opacity:1;color:var(--g-ink)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}

/* ---------- map ---------- */
.mapwrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.map{display:block;width:100%;height:auto}
.map use{fill:var(--land);stroke:var(--land-line);stroke-width:.6}
.map .grat{stroke:var(--grid);fill:none;stroke-width:.8}
.map .pin{cursor:pointer}
.map .pin circle{stroke:var(--surface);stroke-width:2.5}
.map .pin text{font:700 12px var(--f-mono);fill:var(--g-ink);pointer-events:none}
.map .pin.sel circle{stroke:var(--ink)}
.map .lbl{font:600 13px var(--f-body);fill:var(--muted);letter-spacing:.06em}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:4px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.entry{padding:0;overflow:hidden}
.entry .photo{height:84px;position:relative;background:var(--surface-2)}
.entry .photo svg{position:absolute;inset:0;width:100%;height:100%}
.entry .photo.has-photo{height:130px}
.entry .photo .grade{position:absolute;left:12px;top:12px}
.entry .photo .pill{position:absolute;right:10px;top:10px}
.entry .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.entry h3{font-size:16px}
.rate{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.rate b{color:var(--ink);font-family:var(--f-mono)}
.entry p{margin:0;font-size:14px}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;font-weight:700}
.field select,.field input[type=date],.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.pick{display:flex;gap:6px}
.pick button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font:700 14px var(--f-mono)}
.pick button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.cb{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.cb input{width:18px;height:18px;margin-top:2px;accent-color:var(--forest)}

/* ---------- me ---------- */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.badge.got{border-color:var(--forest);background:var(--surface-2)}
.badge .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.badge.got .ico{background:var(--forest);color:var(--forest-ink)}
.badge .ico svg{width:20px;height:20px}
.badge b{font-size:14px;line-height:1.2}
.badge small{font-size:12px;color:var(--muted);line-height:1.3}
.badge .reward{font-size:11.5px;font-weight:700;color:var(--blaze)}
.ladder{display:flex;flex-direction:column;gap:8px}
.ladder .bar{height:12px}
.soon{display:flex;flex-direction:column;gap:4px}

/* ---------- small screens ---------- */
@media (max-width: 900px){
  .stage{grid-template-columns:minmax(0,1fr);gap:12px;padding-inline:0;padding-block:0}
  .guide{position:static;padding-inline:16px;padding-block:16px 4px;gap:12px}
  .guide .long{display:none}
  .phone{border-radius:0;border:0;box-shadow:none;width:auto;height:auto;margin:0;overflow:visible;padding-bottom:70px;zoom:1!important}
  .statusbar,.tabs::after{display:none}
  .appbar{padding-top:14px}
  .screen{overflow:visible}
  .appbar{top:env(safe-area-inset-top,0px)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:10}
  .toast{position:fixed;bottom:84px}
}
@media (min-width: 901px){ .guide .short{display:none} }

  const briefDone = !!t.briefing && m.attended.includes(t.briefing);

  if (status === 'notyet' && override) status = 'override';
  const prepHave = prep.reduce((a, p) => a + p.have, 0), prepNeed = prep.reduce((a, p) => a + p.need, 0);
  return {status, prep, prepDone, expDone, best, pendingExp, briefDone, override, prepHave, prepNeed, grade:g};
}

/* ---------- elevation profiles ---------- */
function hash(s){ let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 9973; return h; }
function profile(t){
  const n = 90, seed = hash(t.id), pts = [], P = t.peak || .5;
  for (let i = 0; i < n; i++){
    const x = i / (n - 1);
    let f;
    if (t.shape === 'loop'){
      f = Math.pow(Math.sin(Math.PI * x), .8) * (.72 + .28 * Math.sin(x * 11 + seed));
    } else {
      const u = x <= P ? x / P : (1 - x) / (1 - P);
      f = Math.pow(Math.sin(u * Math.PI / 2), 1.25);
    }
    f += .045 * (Math.sin(x * 29 + seed) + .6 * Math.sin(x * 71 + seed * 2)) * Math.sin(Math.PI * Math.min(1, f + .05));
    f = Math.max(0, Math.min(1, f));
    pts.push({d:x * t.dist, a:t.start + (t.max - t.start) * f});
  }
  // pin the true summit
  let mi = 0; pts.forEach((p, i) => { if (p.a > pts[mi].a) mi = i; }); pts[mi].a = t.max;
  return pts;
}
const PROF = Object.fromEntries(TRAILS.map(t => [t.id, profile(t)]));

function silhouette(t, w, h, opts = {}){
  const pts = PROF[t.id], lo = Math.min(...pts.map(p => p.a)), hi = t.max;
  const top = opts.top ?? .18, base = opts.base ?? 1;
  const xy = pts.map(p => [p.d / t.dist * w, h * base - (p.a - lo) / (hi - lo || 1) * h * (base - top)]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="g${t.grade}" style="color:var(--gc)" aria-hidden="true">
    <path d="${line}L${w} ${h}L0 ${h}Z" fill="currentColor" opacity="${opts.op ?? .28}"/>
    <path d="${line}" fill="none" stroke="currentColor" stroke-width="${opts.sw ?? 2}" vector-effect="non-scaling-stroke"/></svg>`;
}

function niceStep(range, maxTicks, steps){ return steps.find(s => range / s <= maxTicks) || steps[steps.length - 1]; }
function elevationChart(t){
  const pts = PROF[t.id], W = 360, H = 170, L = 44, R = 12, T = 22, B = 26;
  const amin = Math.min(...pts.map(p => p.a)), amax = t.max;
  const as = niceStep(amax - amin, 4, [25, 50, 100, 200, 250, 500, 1000]);
  const y0 = Math.floor(amin / as) * as, y1 = Math.ceil(amax / as) * as;
  const xs = niceStep(t.dist, 6, [1, 2, 5, 10, 20]);
  const X = v => L + v / t.dist * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let v = y0; v <= y1 + .1; v += as) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${n0(v)}</text>`;
  for (let v = 0; v <= t.dist + .01; v += xs) g += `<text class="ax" x="${X(v)}" y="${H - 8}" text-anchor="middle">${v}</text>`;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.a).toFixed(1)).join('');
  const top = pts.find(p => p.a === t.max);
  const tx = X(top.d), anchor = tx > W - 70 ? 'end' : tx < L + 50 ? 'start' : 'middle';
  return `<svg class="chart g${t.grade}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Elevation profile of ${esc(t.name)}: ${n0(t.start)} m to ${n0(t.max)} m over ${t.dist} km">
    ${g}
    <path d="${line}L${X(t.dist)} ${Y(y0)}L${X(0)} ${Y(y0)}Z" fill="var(--gc)" opacity=".18"/>
    <path d="${line}" fill="none" stroke="var(--gc)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${tx}" cy="${Y(t.max)}" r="4.5" fill="var(--gc)" stroke="var(--surface)" stroke-width="2"/>
    <text class="ax" x="${tx}" y="${Y(t.max) - 9}" text-anchor="${anchor}" style="fill:var(--ink);font-weight:700">${n0(t.max)} m</text>
  </svg><div class="row muted" style="font-size:11.5px;justify-content:space-between"><span>Elevation (m)</span><span>Distance (km)</span></div>`;
}

/* ---------- map ---------- */
const PROJ = {s:636.6197723675812, tx:-1022.2222222222217, ty:566.0150699031594};
const proj = (lon, lat) => [PROJ.tx + PROJ.s * lon * Math.PI / 180, PROJ.ty - PROJ.s * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
function places(entries){
  // group entries by trail, then cluster trails that sit on top of each other (e.g. all of Singapore)
  const byTrail = {};
  entries.forEach(e => (byTrail[e.trail] = byTrail[e.trail] || []).push(e));
  const clusters = [];
  Object.keys(byTrail).forEach(id => {
    const t = TR[id], [x, y] = proj(t.lon, t.lat);
    let c = clusters.find(c => Math.hypot(c.x - x, c.y - y) < 28);
    if (!c){ c = {key:id, x, y, trails:[], entries:[]}; clusters.push(c); }
    c.trails.push(id); c.entries.push(...byTrail[id]);
  });
  clusters.forEach(c => { c.grade = Math.max(...c.trails.map(id => TR[id].grade)); 
    const names = {SG:'Singapore', MY:'Malaysia', ID:'Indonesia', JP:'Japan'};
    const cs = [...new Set(c.trails.map(id => TR[id].country))];
    c.name = c.trails.length === 1 ? TR[c.trails[0]].short : cs.map(k => names[k]).join(' & ');
  });
  return clusters;
}
function graticule(){
  let p = '';
  for (let lon = 100; lon <= 140; lon += 10){ const [x1, y1] = proj(lon, -12), [, y2] = proj(lon, 43); p += `M${x1.toFixed(1)} ${y1.toFixed(1)}V${y2.toFixed(1)}`; }
  for (let lat = -10; lat <= 40; lat += 10){ const [x1, y] = proj(90, lat), [x2] = proj(147, lat); p += `M${x1.toFixed(1)} ${y.toFixed(1)}H${x2.toFixed(1)}`; }
  return `<path class="grat" d="${p}"/>`;
}
function mapSvg(clusters, community){
  const pins = clusters.slice().sort((a, b) => b.y - a.y).map(c => {
    const n = community ? new Set(c.entries.map(e => e.who)).size : c.entries.length;
    const r = community ? 9 + Math.sqrt(n) * 4 : 12;
    const sel = S.mapSel === c.key;
    return `<g class="pin g${c.grade}${sel ? ' sel' : ''}" data-a="mapsel" data-id="${c.key}" role="button" tabindex="0" aria-label="${esc(c.name)}: ${n}">
      <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="var(--gc)"/>
      <text x="${c.x.toFixed(1)}" y="${(c.y + 4).toFixed(1)}" text-anchor="middle">${n}</text></g>`;
  }).join('');
  const lbl = (txt, lon, lat) => { const [x, y] = proj(lon, lat); return `<text class="lbl" x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle">${txt}</text>`; };
  return `<svg class="map" viewBox="0 110 600 594" role="img" aria-label="Map of climbs">
    ${graticule()}<use href="#land"/>
    ${lbl('SOUTH CHINA SEA', 113, 12)}${lbl('JAPAN', 135.5, 38.5)}${lbl('BORNEO', 113.8, .8)}${lbl('SUMATRA', 101.8, -1.6)}${lbl('PHILIPPINES', 122.4, 15.5)}
    ${pins}</svg>`;
}

function sessionCard(s, opts = {}){
  const m = me(), T = TYPES[s.type];
  const going = m.rsvps.includes(s.id), done = m.attended.includes(s.id);
  const toward = DB.trips.filter(t => t.prep[s.type] || t.briefing === s.id).map(t => {
    const mine = t.participants.includes(m.id);
    return `<span class="${mine ? 'mine' : ''}">${t.briefing === s.id ? 'Required for' : 'Counts toward'} ${TR[t.trail].short}</span>`;
  }).join('');
  let act = '';
  if (!isFuture(s)) act = done ? `<span class="done">✓ Attended</span>` : '';
  else if (done) act = `<span class="done">✓ Checked in</span>`;
  else if (going) act = `<button class="btn sm ghost" data-a="rsvp" data-id="${s.id}">Going ✓</button><button class="btn sm blaze" data-a="checkin" data-id="${s.id}">Check in (demo)</button>`;
  else act = `<button class="btn sm" data-a="rsvp" data-id="${s.id}">RSVP</button>`;
  const spots = s.cap ? `<span class="meta num">${s.going + (going || done ? 1 : 0)}/${s.cap} going</span>` : '';
  return `<article class="card sess">
    <div class="date"><span>${fmt(s.date, {weekday:'short'})}</span><b>${d(s.date).getDate()}</b><span>${fmt(s.date, {month:'short'})}</span></div>
    <div style="min-width:0">
      <span class="tag ${T.cat}">${T.short}</span>
      <h3>${esc(sessTitle(s))}</h3>
      <div class="meta">${s.time} · ${esc(s.place)} · led by ${M(s.leader).first}</div>
      ${opts.desc ? `<div class="meta" style="margin-top:4px">${T.what}</div>` : ''}
      ${toward ? `<div class="counts">${toward}</div>` : ''}
      ${act || spots ? `<div class="actions">${act}${spots}</div>` : ''}
    </div></article>`;
}

function tripCard(t){
  const m = me(), tr = TR[t.trail];
  const leading = t.leaders.includes(m.id);
  const joined = t.participants.includes(m.id);
  let right;
  if (leading){
    const rs = t.participants.map(id => readiness(M(id), t));
    const not = rs.filter(r => r.status === 'notyet').length;
    right = `<span class="pill override">You're leading</span>${not ? `<span class="pill notyet">${not} not ready</span>` : ''}`;
  } else {
    const r = readiness(m, t);
    right = `${statusPill(r)}${joined ? '<span class="pill verified">Joined</span>' : ''}`;
  }
  return `<button class="card tap tripcard" data-a="push" data-v="trip" data-id="${t.id}">
    <div class="art${photoOf(tr.id) ? ' has-photo' : ''}">${photoImg(tr) || silhouette(tr, 400, 70, {top:.1})}</div>

    </div></button>`;
}

      </div>`);

function screenTrain(){
  const m = me(), f = S.trainFilter;
  const list = SESSIONS.filter(isFuture).filter(s => f === 'all' || TYPES[s.type].cat === f);
  const weekKey = iso => { const x = d(iso); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return x.toISOString().slice(0, 10); };
  const thisWeek = weekKey(TODAY);
  const groups = {};
  list.forEach(s => (groups[weekKey(s.date)] = groups[weekKey(s.date)] || []).push(s));
  const label = k => {
    const diff = Math.round((d(k) - d(thisWeek)) / 864e5 / 7);

let toastTimer;
function toast(msg){ S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(true); }, 3200); }

function go(to){
  S.stack = [];
  const [k, v] = to.split(':');
  if (k === 'tab') S.tab = v;
  else if (k === 'trip'){ S.tab = 'trips'; S.stack = [{v:'trip', id:v}]; }
  else if (k === 'trail'){ S.tab = 'trails'; S.stack = [{v:'trail', id:v}]; }
  else if (k === 'map'){ S.tab = 'map'; S.mapMode = v; S.mapSel = null; }
  else if (k === 'log'){ S.tab = 'map'; S.mapMode = 'mine'; S.form = null; S.stack = [{v:'log'}]; }
  else if (k === 'me'){ S.stack = [{v:'me'}]; }
}

function act(a, ds){
  const m = me();
  switch (a){
    case 'tab': S.tab = ds.id; S.stack = []; S.mapSel = null; break;
    case 'push': if (ds.v === 'log') S.form = null; S.stack.push({v:ds.v, id:ds.id}); break;
    case 'back': S.stack.pop(); break;
    case 'persona': S.persona = ds.id; S.stack = S.stack.filter(x => x.v !== 'log'); S.mapSel = null; toast(`Now viewing as ${me().first}`); break;
    case 'notes': S.notes = !S.notes; return render(true);
    case 'reset': reset(); toast('Demo reset to the starting data'); break;
    case 'tour': S.persona = ds.p; go(ds.to); break;
    case 'trainfilter': S.trainFilter = ds.id; return render(true);
    case 'gradefilter': S.gradeFilter = +ds.id; return render(true);
    case 'mapmode': S.mapMode = ds.id; S.mapSel = null; return render(true);
    case 'mapsel': S.mapSel = S.mapSel === ds.id ? null : (ds.id || null); return render(true);
    case 'rsvp': {
      const i = m.rsvps.indexOf(ds.id);
      if (i >= 0) m.rsvps.splice(i, 1); else { m.rsvps.push(ds.id); toast(`You're going to ${sessTitle(SE[ds.id])} on ${fmt(SE[ds.id].date)}`); }
      return render(true);
    }
    case 'checkin': {
      const s = SE[ds.id];
      m.attended.push(s.id); m.rsvps = m.rsvps.filter(x => x !== s.id);
      let msg = `Checked in to ${sessTitle(s)}`;
      if (s.trail){ m.journal.push({id:'j' + (++DB.seq), trail:s.trail, date:s.date, diff:2, fun:4, note:'Logged automatically from an ALT practice hike.', source:'alt', status:'verified'}); msg += `. ${TR[s.trail].short} added to your map`; }
      const unlocked = DB.trips.filter(t => !t.leaders.includes(m.id) && readiness(m, t).prepDone && (t.prep[s.type]) && (() => { const c = counts(m); c[s.type]--; return !Object.entries(t.prep).every(([k, n]) => (c[k] || 0) >= n); })());
      if (unlocked.length) msg += `. Prep complete for ${unlocked.map(t => TR[t.trail].short).join(' & ')}!`;
      toast(msg); return render(true);
    }
    case 'join': { const t = trip(ds.id); t.participants.push(m.id); toast(`You've joined ${t.title}`); return render(true); }
    case 'leave': { const t = trip(ds.id); t.participants = t.participants.filter(x => x !== m.id); toast(`You've left ${t.title}`); return render(true); }
    case 'verify': case 'reject': {
      const x = M(ds.m), j = x.journal.find(j => j.id === ds.id);
      if (a === 'verify'){ j.status = 'verified'; toast(`${TR[j.trail].short} verified for ${x.first}. It now counts as proven experience.`); }
      else { toast(`Asked ${x.first} for a clearer GPS track or summit photo`); }
      return render(true);
    }
    case 'override': DB.overrides[ds.id + ':' + ds.m] = {by:m.id}; toast(`${M(ds.m).first} approved for this trip. Your name is recorded on the decision.`); return render(true);
    case 'unoverride': delete DB.overrides[ds.id + ':' + ds.m]; return render(true);
    case 'renew': m.certs[+ds.id].until = '2028-11-30'; toast('Certification renewed to 30 Nov 2028'); return render(true);
    case 'formpick': S.form[ds.k] = +ds.id; return render(true);
  }
  render(false);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  e.preventDefault();
  act(el.dataset.a, el.dataset);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-a][role="button"]')){ e.preventDefault(); act(e.target.dataset.a, e.target.dataset); }
});
document.addEventListener('input', e => {
  if (!S.form || !e.target.closest('#logform')) return;
  const t = e.target;
  if (t.name === 'trail') S.form.trail = t.value;
  if (t.name === 'date') S.form.date = t.value;
  if (t.name === 'note') S.form.note = t.value;
  if (t.name === 'evidence') S.form.evidence = t.checked;
});
document.addEventListener('change', e => {
  if (e.target.name === 'evidence' && S.form) S.form.evidence = e.target.checked;
  const id = e.target.dataset && e.target.dataset.photo, file = e.target.files && e.target.files[0];
  if (!id || !file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    // shrink to a reasonable size so it fits in browser storage
    const k = Math.min(1, 1000 / img.width), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    savePhoto(id, c.toDataURL('image/jpeg', .82));
    toast(`Photo added to ${TR[id].short}`);
    render(true);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That file could not be read as an image. Try a JPG or PNG.'); render(true); };
  img.src = url;
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'logform') return;
  e.preventDefault();
  const f = S.form, m = me();
  m.journal.push({id:'j' + (++DB.seq), trail:f.trail, date:f.date || TODAY, diff:f.diff, fun:f.fun, note:f.note.trim(), source:'self', status:'pending', evidence:f.evidence ? 'GPS track' : null});
  S.stack = []; S.tab = 'map'; S.mapMode = 'mine'; S.mapSel = null; S.form = null;
  toast(`${TR[f.trail].short} pinned to your map. A leader will verify it${f.evidence ? '' : ' once you add a GPS track or photo'}.`);
  render(false);
});

// shrink the iPhone frame to fit shorter desktop windows
function fitPhone(){
  const ph = document.getElementById('phone');
  if (window.matchMedia('(max-width: 900px)').matches){ ph.style.zoom = ''; return; }
  const k = Math.min(1, (window.innerHeight - 40) / 874);
  ph.style.zoom = k < 1 ? k.toFixed(3) : '';
}
window.addEventListener('resize', fitPhone);
render(false);
fitPhone();
</script>
